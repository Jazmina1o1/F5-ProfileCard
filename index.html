<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazmin | Executive Chef</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="flip-demo">
  
  <main class="flip-card" id="profile-card">
    <div class="flip-card-inner">
      <section class="card-face flip-card-front" aria-label="Profile">
        <img class="profile-photo" src="https://github.com/Jazmina1o1/images/blob/main/images%20(1).jpg?raw=true" alt="Jazmin, executive chef" width="150" height="150">

        <div class="profile-content">
          <h1>Jazmin</h1>
          <h5>Executive Chef</h5>
          <p>I specialize in pasta dishes and have worked in the culinary industry for over 10 years.</p>
          <div class="icons" aria-label="Social icons">
            <a href="#"><i class="fa fa-dribbble"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-linkedin"></i></a>
            <a href="#"><i class="fa fa-facebook"></i></a>
          </div>
        </div>
      </section>
      <section class="card-face flip-card-back" aria-label="More about Jazmin">
        <div class="back-content">
          <p class="back-kicker">Fresh from the kitchen</p>
          <h2>Let's talk pasta.</h2>
          <div class="pasta-photos" aria-label="Pasta dishes">
            <img src="" alt="Fresh pasta with tomatoes and herbs">

            <img src="" alt="A plate of pasta">
          </div>
          <p class="back-description">Good food brings people together. Get in touch to share a recipe or plan something delicious.</p>
          <a class="email-contact" href="mailto:Executivepasta@gmail.com">
            <i class="fa fa-envelope" aria-hidden="true"></i>
           Executivepasta@gmail.com
          </a>
        </div>
        <p class="flip-hint">Hover to flip back</p>
      </section>
    </div>
  </main>
</body>
</html>
